[package]
name = "executor"
version = "0.1.0"
edition = "2024"
description = "Apply ordered Git patches and file operations to the current working directory"
license = "GPL-3.0-only"

[dependencies]
clap = { version = "4", features = ["derive"] }
git2 = { version = "0.20", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"
